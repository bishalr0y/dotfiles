# Rex app settings (macOS domain: com.superlogical.rex)
#
# init.lua is keys/actions only. Font, tabs, and sidebar live here.
# After editing: `dot stow` (or `dot update`), then `dot rex apply`, then
# quit Rex (Cmd+Q) and reopen — `rex config reload` does not apply this file.
#
# Format: KEY TYPE VALUE  (# comments and blank lines ignored)
# Types: string | float | int | bool

Workspace.terminalFontName string Berkeley Mono
Workspace.terminalFontPointSize float 15.6

# Workspace.terminalFontName string MonoLisa
# Workspace.terminalFontPointSize float 14.8

Workspace.terminalCursorStyle string block

Workspace.terminalOptionKeyBehavior string actsAsAlt
Workspace.terminalPaddingColor string background
Workspace.inactivePaneFadeMode string both

Workspace.interfaceStyle string useTheme
Workspace.tabStyle string vertical
Workspace.sidebarPosition string left
Workspace.sidebarWidth float 256
Workspace.sidebarShowsActivity bool false
Workspace.usesPaneGlass bool false
Workspace.tabIconTintMode string off

Workspace.showsKeySequenceHints bool true

rex.client.remoteControl bool true
rex.server.automatic-restart-enabled bool true
