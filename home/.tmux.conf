# Basics
set -s escape-time 0                     # vim mode switching, no lag
set -g history-limit 50000               # bigger scrollback
set -g display-time 4000                 # keep messages up longer
set -g status-interval 5                 # refresh status bar faster
set -g default-terminal "tmux-256color"  # proper term
set -g focus-events on                   # focus events where supported
setw -g aggressive-resize on             # resize panes aggressively

# Extended keys (Shift+Enter, Ctrl+Shift+key, etc.)
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Prefix
unbind C-b
set -g prefix C-\;

# Mouse
set -g mouse on

# Pane focus
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (prefix + Shift + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits
unbind %
bind \\ split-window -h
unbind '"'
bind - split-window -v

# Indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows 1

# Pane actions
bind x kill-pane
unbind z
unbind m
bind m resize-pane -Z

# Reload
unbind r
bind r source-file ~/.tmux.conf

# Detach alias
bind q detach-client

# Session/workspace picker
bind w choose-tree -Zs

# Pane cycling
bind Tab select-pane -t :.+
bind ';' select-pane -t :.+
bind BTab select-pane -t :.-



# Copy mode (vi)
set-window-option -g mode-keys vi
bind v copy-mode

bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi Escape send-keys -X clear-selection
bind -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# New windows/splits in cwd
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Pane borders
set -g pane-border-lines single
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour240

# Status bar
set -g status-position bottom
set -g status-style bg=black,fg=white

# vim-tmux-navigator (ctrl+h/j/k/l between nvim and tmux panes)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

if "test ! -d ~/.config/tmux/plugins/vim-tmux-navigator" \
   "run 'git clone https://github.com/christoomey/vim-tmux-navigator ~/.config/tmux/plugins/vim-tmux-navigator'"

run '~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
